version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - defect-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - defect-net
    restart: unless-stopped

networks:
  defect-net:
    driver: bridge
